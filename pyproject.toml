[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews-lite"
version = "1.0.0"
description = "Lightweight fake news detection: an XGBoost + TextCNN ensemble with part-of-speech features"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
keywords = ["fake-news-detection", "nlp", "ensemble-learning", "xgboost", "textcnn", "welfake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.8",
    "nltk>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "tensorflow>=2.16,<2.21",
    "xgboost>=2.1",
]

[project.optional-dependencies]
app = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "requests>=2.32",
]
bench = [
    "psutil>=5.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fakenews = "fakenews.cli:main"

[project.urls]
Repository = "https://github.com/OWNER/fakenews-lite"
Issues = "https://github.com/OWNER/fakenews-lite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "experiments"]
# The notebook is kept verbatim as the original exploratory record.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts import the sibling _report module, which requires the
# script directory on sys.path before the import runs.
"experiments/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
