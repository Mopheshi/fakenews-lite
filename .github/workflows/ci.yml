name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,bench,dev]"

      - name: Download NLTK resources
        run: python -c "from fakenews.nltk_resources import ensure_nltk_resources; ensure_nltk_resources()"

      - name: Lint
        run: ruff check .

      - name: Test
        # The unit tests deliberately need neither the dataset nor the embeddings.
        run: pytest -q
